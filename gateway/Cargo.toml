[package]
name = "conxian-gateway"
version = "0.2.0"
edition = "2021"
authors = ["Conxian Team"]
description = "Unified Gateway for Conxian Network Sovereign Services and Bitcoin Layers"
license = "MIT OR Apache-2.0"

[dependencies]
actix-web = "4.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.10"
log = "0.4"
reqwest = { version = "0.11", features = ["json"] }
futures = "0.3"
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
lru = "0.12"
btleplug = "0.11"
crc = "3.0"

[lib]
name = "conxian_gateway"
path = "src/lib.rs"
