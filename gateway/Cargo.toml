[package]
name = "conxian-gateway"
version = "0.1.0"
edition = "2021"
authors = ["Conxian Team"]
description = "Unified Gateway for Conxian Network Sovereign Services and Bitcoin Layers"
license = "MIT OR Apache-2.0"

[dependencies]
actix-web = "4.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.10"
log = "0.4"

[lib]
name = "conxian_gateway"
path = "src/lib.rs"
