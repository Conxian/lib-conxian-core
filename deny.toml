# cargo-deny configuration for lib-conxian-core
# Run locally: cargo deny check
# CI enforcement: .github/workflows/main.yml

[graph]
all-features = false
no-default-features = false

[advisories]
ignore = [
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill — unmaintained transitive dep via postcard → frost-core" },
    { id = "RUSTSEC-2024-0384", reason = "instant — unmaintained transitive dep; awaiting upstream migration" },
    { id = "RUSTSEC-2024-0388", reason = "fxhash — unmaintained transitive dep via sled → bdk" },
    { id = "RUSTSEC-2024-0436", reason = "paste — unmaintained transitive dep; awaiting upstream migration" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash — duplicate advisory ID; same crate as RUSTSEC-2024-0388" },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki v0.101 — URI name constraint bug; electrum-client pins old rustls" },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki v0.101 — wildcard name constraint bug; electrum-client blocks upgrade" },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki v0.101 — CRL parsing panic; electrum-client blocks upgrade" },
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "MITNFA",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "MPL-2.0",
    "MPL-2.0-no-copyleft-exception",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
