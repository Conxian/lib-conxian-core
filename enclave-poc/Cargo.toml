[package]
name = "enclave-poc"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "enclave-poc"
path = "src/main.rs"

[dependencies]
lib-conxian-core = { path = ".." }
lib-conxian-core-enclave = { path = "../addons/lib-conxian-core-enclave" }
conxius-enclave-sdk = "=2.0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
sha2 = "0.10"

