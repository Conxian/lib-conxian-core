[package]
name = "lib-conxian-core"
version = "0.2.0"
edition = "2021"

[dependencies]
secp256k1 = { version = "0.28.2", features = ["rand-std", "global-context"] }
sha2 = "0.10.8"
rand = "0.8.5"
hex = "0.4.3"
ark-bn254 = "0.4"
ark-ff = "0.4"
ark-groth16 = "0.4"
ark-serialize = "0.4"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }

[workspace]
members = ["gateway"]
