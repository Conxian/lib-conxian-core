[package]
name = "lib-conxian-core"
version = "0.2.2"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
ripemd = "0.2"
serde_json = "1.0"
secp256k1 = { version = "0.29.1", features = ["rand-std", "global-context"] }
sha2 = "0.11.0"
rand = "0.9.2"
hex = "0.4.3"
ark-bn254 = "0.6"
ark-ff = "0.6"
ark-groth16 = { version = "0.6", default-features = false }
ark-serialize = "0.6"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }

[workspace]
members = ["gateway"]
