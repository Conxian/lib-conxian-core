[package]
name = "lib-conxian-core"
version = "0.2.10"
description = "Foundational library and Vault SDK for the Conxian protocol ecosystem."
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Conxian/lib-conxian-core"
homepage = "https://github.com/Conxian/lib-conxian-core"
readme = "README.md"
keywords = ["bitcoin", "sdk", "musig2", "taproot", "conxian"]
categories = ["cryptography::cryptocurrencies", "sdk"]

[dependencies]
anyhow = "1.0"
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
ripemd = "0.2"
serde_json = "1.0"
secp256k1 = { version = "0.31", features = ["rand", "global-context"] }
sha2 = "0.11.0"
rand = "0.10"
hex = "0.4.3"
ark-bn254 = "0.6"
ark-ff = "0.6"
ark-groth16 = { version = "0.6", default-features = false }
ark-serialize = "0.6"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
der = { version = "0.7", features = ["derive", "alloc"] }

# CXIP 20 Foundational Dependencies (Synchronized to v0.2.5 Strategic SDKs)
bitcoin = { version = "0.32", features = ["serde", "rand", "std"] }
bdk = { version = "0.30.2", features = ["key-value-db"] }
lightning = { version = "0.2.3", features = ["std"] }
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }
rgb-core = "0.12.0"
rgb-std = "0.12.0-rc.3"
aluvm = "0.12.0"
chrono = { version = "0.4.45", features = ["serde"] }

[workspace]
members = []
