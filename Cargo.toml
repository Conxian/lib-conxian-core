[package]
name = "lib-conxian-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
ripemd = "0.1"
serde_json = "1.0"
secp256k1 = { version = "0.28.2", features = ["rand-std", "global-context"] }
sha2 = "0.10.8"
rand = "0.8.5"
hex = "0.4.3"
ark-bn254 = "0.4"
ark-ff = "0.4"
ark-groth16 = "0.4"
ark-serialize = "0.4"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }

[workspace]
members = ["gateway"]
