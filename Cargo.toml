[package]
name = "lib-conxian-core"
version = "0.3.1"
description = "Foundational library and shared protocol primitives for the Conxian ecosystem."
edition = "2021"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Conxian/lib-conxian-core"
homepage = "https://www.conxian-labs.com"
readme = "README.md"
keywords = ["bitcoin", "protocol", "taproot", "conxian"]
categories = ["cryptography::cryptocurrencies"]

[dependencies]
anyhow = "1.0"
k256 = { version = "0.14", features = ["ecdsa", "sha256"] }
ripemd = "0.2"
semver = "1.0"
serde_json = "1.0"
secp256k1 = { version = "0.31", features = ["rand", "global-context"] }
sha2 = "0.11.0"
rand = "0.10"
hex = "0.4.3"
ark-bn254 = "0.6"
ark-ff = "0.6"
ark-groth16 = { version = "0.6", default-features = false }
ark-serialize = "0.6"
base64 = "0.23"
serde = { version = "1.0", features = ["derive"] }
der = { version = "0.8", features = ["derive", "alloc"] }

# CXIP 20 Foundational Dependencies (Synchronized to v0.2.5 Strategic SDKs)
bitcoin = { version = "0.32", features = ["serde", "rand", "std"] }
lightning = { version = "0.2.4", features = ["std"] }
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }
rgb-core = "0.12.0"
rgb-std = "0.12.0-rc.3"
aluvm = "0.12.0"
chrono = { version = "0.4.45", features = ["serde"] }

# Production Vault SDK (Conxian-Labs Enclave SDK)
# This crate provides hardware-backed signing, attestation, and policy primitives.
# For full enclave SDK capabilities, see: https://crates.io/crates/conxius-enclave-sdk
# Pinned to Git tag v2.0.14; its manifest package version remains 2.0.12.
conxius-enclave-sdk = { git = "https://github.com/Conxian/conxius-enclave-sdk", tag = "v2.0.14", default-features = false, optional = true }

[features]
default = []
enclave = ["conxius-enclave-sdk"]

# ── SDK capability exposure (Session 52: align core with all SDK modules) ──
# Each feature gate exposes a category of conxius-enclave-sdk modules through
# conxian_core::sdk::*, making all 70 accessible SDK modules available to downstream crates
# that depend on lib-conxian-core.

# Blockchain protocols (24 modules)
sdk-blockchain = ["conxius-enclave-sdk"]
# Cross-cutting capabilities (15 modules)
sdk-cross-cutting = ["conxius-enclave-sdk"]
# Reserved compatibility feature; all six SDK rails are currently pub(crate).
sdk-rails = ["conxius-enclave-sdk"]
# Nexus verification (2 modules)
sdk-nexus = ["conxius-enclave-sdk"]
# Infrastructure & tooling (5 modules)
sdk-infrastructure = ["conxius-enclave-sdk"]
# Signing primitives (13 modules)
sdk-signing = ["conxius-enclave-sdk"]

# Meta-feature: enable ALL SDK capabilities
full-sdk = [
    "enclave",
    "sdk-blockchain",
    "sdk-cross-cutting",
    "sdk-rails",
    "sdk-nexus",
    "sdk-infrastructure",
    "sdk-signing",
]

[workspace]
members = [
    "fuzz",
    "tests/sdk-compat",
    "tests/integration",
    "addons/lib-conxian-core-enclave",
]
