name: Publish to crates.io

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.2.11)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Configure sparse Cargo registry
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'EOF'
          [registries.crates-io]
          protocol = "sparse"
          index = "sparse+https://index.crates.io/"
          EOF

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "::error::CARGO_REGISTRY_TOKEN is unavailable; configure the repository secret before publishing."
            echo "Add CARGO_REGISTRY_TOKEN under Settings > Secrets and variables > Actions."
            echo "See https://doc.rust-lang.org/cargo/reference/config.html#credentials for Cargo registry authentication details."
            exit 1
          fi

          cargo publish

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' && success() }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body: |
            ## ${{ github.ref_name }} Release Notes

            ### Highlights & Migration
            For release highlights, breaking changes, and migration guides, please refer to the following documents:
            - [Changelog](CHANGELOG.md) - Full version history and detailed change descriptions
            - [Migration Guide](docs/MIGRATION.md) - Instructions for migrating between versions

            ### Note
            Publication is authenticated with the `CARGO_REGISTRY_TOKEN` repository secret. If publication fails or needs a manual retry, configure that secret before rerunning the workflow.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
