name: Publish to crates.io

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run cargo publish --dry-run instead of publishing'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Configure sparse Cargo registry
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'EOF'
          [registries.crates-io]
          protocol = "sparse"
          index = "sparse+https://index.crates.io/"
          EOF

      - name: Verify release parity
        id: release_parity
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            python scripts/verify_release_hygiene.py --tag "$GITHUB_REF_NAME"
          else
            python scripts/verify_release_hygiene.py
          fi

      - name: Check crates.io version
        id: crates_state
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        run: |
          set +e
          python scripts/verify_release_hygiene.py --crates-io-state
          status=$?
          set -e

          if [[ "$status" -eq 0 ]]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          elif [[ "$status" -eq 10 ]]; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not safely determine the crates.io publication state."
            exit "$status"
          fi

      - name: Publish to crates.io (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: cargo publish --dry-run

      - name: Publish to crates.io
        id: publish
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)) && steps.crates_state.outputs.already_published != 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "::error::CARGO_REGISTRY_TOKEN is required for tag pushes and manual real publishing."
            echo "::error::Configure the crates.io secret or select dry_run for a manual validation."
            echo "::error::Add CARGO_REGISTRY_TOKEN under Settings > Secrets and variables > Actions."
            exit 1
          fi

          if cargo publish; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            publish_status=$?
            echo "::warning::cargo publish exited non-zero; checking the exact crates.io version before failing closed."
            if python scripts/verify_release_hygiene.py --crates-io-state; then
              echo "already_published=true" >> "$GITHUB_OUTPUT"
              echo "Publication is already confirmed on crates.io; treating this run as a safe retry."
            else
              echo "::error::Publication did not succeed and the expected crates.io version was not confirmed."
              exit "$publish_status"
            fi
          fi

      - name: Verify crates.io publication
        id: crates_verify
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        run: |
          set -euo pipefail
          python scripts/verify_release_hygiene.py --wait-for-crates-io --poll-attempts 12 --poll-delay-seconds 10

      - name: Check GitHub Release state
        id: github_release_state
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python scripts/verify_release_hygiene.py --github-release-state --tag "$GITHUB_REF_NAME"
          status=$?
          set -e

          if [[ "$status" -eq 0 ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [[ "$status" -eq 10 ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not safely determine GitHub Release state."
            exit "$status"
          fi

      - name: Create GitHub Release
        if: >-
          ${{
            github.event_name == 'push' &&
            steps.release_parity.outcome == 'success' &&
            steps.crates_verify.outcome == 'success' &&
            (steps.publish.outcome == 'success' || steps.crates_state.outputs.already_published == 'true') &&
            steps.github_release_state.outcome == 'success' &&
            steps.github_release_state.outputs.exists != 'true'
          }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body: |
            ## ${{ github.ref_name }} Release Notes

            ### Highlights & Migration
            For release highlights, breaking changes, and migration guides, please refer to the following documents:
            - [Changelog](CHANGELOG.md) - Full version history and detailed change descriptions
            - [Migration Guide](docs/MIGRATION.md) - Instructions for migrating between versions

            ### Note
            Publication is authenticated with the `CARGO_REGISTRY_TOKEN` repository secret. If publication fails or needs a manual retry, configure that secret before rerunning the workflow.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
