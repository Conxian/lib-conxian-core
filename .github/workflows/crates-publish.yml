name: Publish to crates.io

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.2.11)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Configure sparse Cargo registry
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'EOF'
          [registries.crates-io]
          protocol = "sparse"
          index = "sparse+https://index.crates.io/"
          EOF

      - name: Publish to crates.io
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            echo "Publishing with CARGO_REGISTRY_TOKEN..."
            cargo publish
          else
            echo "No CARGO_REGISTRY_TOKEN available."
            echo "For trusted publisher, ensure it's configured at:"
            echo "https://crates.io/crates/lib-conxian-core/settings/new-trusted-publisher"
            echo ""
            echo "Attempting tokenless publish..."
            cargo publish --tokenless || {
              echo "Tokenless publish failed."
              echo "To fix: Configure trusted publisher on crates.io or add CARGO_REGISTRY_TOKEN secret."
              exit 1
            }
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body: |
            ## ${{ github.ref_name }} Release Notes

            ### Highlights & Migration
            For release highlights, breaking changes, and migration guides, please refer to the following documents:
            - [Changelog](CHANGELOG.md) - Full version history and detailed change descriptions
            - [Migration Guide](docs/MIGRATION.md) - Instructions for migrating between versions

            ### Note
            If the crates.io publication failed or needs manual retry, ensure the trusted publisher integration is configured or the `CARGO_REGISTRY_TOKEN` secret is added.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
