name: Secret Scanning

on:
  push:
    branches: [ main, dev, staged ]
  pull_request:
    branches: [ main, dev, staged ]

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        run: |
          # Download gitleaks binary directly to avoid action-v2 license requirements for organizations
          VERSION="8.18.2"
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz
          tar -xzf gitleaks_${VERSION}_linux_x64.tar.gz
          ./gitleaks detect --source . -v --redact
