name: Nitro Enclave Signing Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'addons/lib-conxian-core-enclave/**'
      - 'enclave-poc/**'
      - 'src/signing.rs'
      - 'src/control_model.rs'
      - '.github/workflows/nitro-enclave-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'addons/lib-conxian-core-enclave/**'
      - 'enclave-poc/**'
      - 'src/signing.rs'
      - 'src/control_model.rs'
      - '.github/workflows/nitro-enclave-ci.yml'
  workflow_dispatch:
    inputs:
      provision_aws:
        description: 'Provision AWS Nitro instance (requires admin-created OIDC role)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  # ── Build & Test ──────────────────────────────────────────────────────────
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: '1.97.1'

      - name: Test enclave adapter
        run: cargo test --locked -p lib-conxian-core-enclave

      - name: Build and verify enclave POC
        run: |
          cd enclave-poc
          cargo build --release
          cp target/release/enclave-poc ../target/release/enclave-poc 2>/dev/null || true

      - name: Verify POC binary runs
        run: |
          cd enclave-poc
          cargo run --release 2>&1 | tee ../target/poc-output.txt
          grep -q "All scenarios complete" ../target/poc-output.txt
          echo "✅ POC binary validated"

      - name: Upload POC binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enclave-poc
          path: |
            enclave-poc/target/release/enclave-poc
            target/poc-output.txt
          retention-days: 7

  # ── Docker Image Build ────────────────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: enclave-poc

      - name: Build Nitro Enclave Docker image
        run: |
          cd enclave-poc
          docker build -f docker/Dockerfile.enclave -t conxian-nitro-enclave:latest .
          docker save conxian-nitro-enclave:latest -o ../target/nitro-enclave-image.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nitro-enclave-image
          path: target/nitro-enclave-image.tar
          retention-days: 7

  # ── AWS Nitro Provision (manual trigger only) ─────────────────────────────
  provision-nitro:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.provision_aws }}
    runs-on: ubuntu-latest
    needs: docker-build
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Provision Nitro spot instance
        id: provision
        run: |
          set -euo pipefail
          # Use existing security group or create if missing
          SG_ID=$(aws ec2 describe-security-groups \
            --filters Name=group-name,Values=conxian-nitro-sg \
            --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null || true)
          if [ -z "$SG_ID" ] || [ "$SG_ID" = "None" ]; then
            SG_ID=$(aws ec2 create-security-group \
              --group-name conxian-nitro-sg \
              --description "Nitro enclave signing: SSH + gRPC" \
              --query 'GroupId' --output text)
            aws ec2 authorize-security-group-ingress \
              --group-id "$SG_ID" --protocol tcp --port 22 --cidr 0.0.0.0/0
            aws ec2 authorize-security-group-ingress \
              --group-id "$SG_ID" --protocol tcp --port 50051 --cidr 0.0.0.0/0
          fi
          echo "SG: $SG_ID"

          # Discover latest Amazon Linux 2023 AMI with Nitro support
          AMI_ID=$(aws ec2 describe-images \
            --owners amazon \
            --filters "Name=name,Values=al2023-ami-2023*-x86_64" "Name=state,Values=available" \
            --query 'sort_by(Images,&CreationDate)[-1].ImageId' --output text)

          # Find first available subnet in default VPC
          SUBNET_ID=$(aws ec2 describe-subnets \
            --filters "Name=default-for-az,Values=true" \
            --query 'Subnets[0].SubnetId' --output text)

          echo "AMI: $AMI_ID | Subnet: $SUBNET_ID"

          # Launch spot instance with Nitro enabled (fallback instance types)
          for ITYPE in m5.xlarge m5d.xlarge m5n.xlarge m5a.xlarge m6i.xlarge c5.xlarge c5d.xlarge; do
            INSTANCE_ID=$(aws ec2 run-instances \
              --image-id "$AMI_ID" \
              --instance-type "$ITYPE" \
              --security-group-ids "$SG_ID" \
              --subnet-id "$SUBNET_ID" \
              --enclave-options Enabled=true \
              --block-device-mappings '[{"DeviceName":"/dev/xvda","Ebs":{"VolumeSize":30,"VolumeType":"gp3"}}]' \
              --instance-market-options '{"MarketType":"spot","SpotOptions":{"SpotInstanceType":"one-time","InstanceInterruptionBehavior":"terminate"}}' \
              --iam-instance-profile Name=conxian-nitro-enclave-profile \
              --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=conxian-nitro-ci},{Key=TTL,Value=4h}]' \
              --query 'Instances[0].InstanceId' --output text 2>/dev/null || true)
            [ -n "$INSTANCE_ID" ] && [ "$INSTANCE_ID" != "None" ] && break
            echo "No $ITYPE spot capacity, trying next..."
          done

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "ERROR: No Nitro spot capacity available in any instance type"
            exit 1
          fi

          echo "Instance: $INSTANCE_ID"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "sg_id=$SG_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for instance ready
        id: wait
        run: |
          aws ec2 wait instance-status-ok --instance-ids "${{ steps.provision.outputs.instance_id }}"
          IP=$(aws ec2 describe-instances \
            --instance-ids "${{ steps.provision.outputs.instance_id }}" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          echo "IP: $IP"
          echo "public_ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Install Nitro CLI and build EIF
        run: |
          echo "Instance ready at ${{ steps.wait.outputs.public_ip }}"
          echo "SSH setup requires key pair or SSM - configure based on your AWS setup"
          echo "For production: pre-bake EIF in the Docker image"

      - name: Teardown (always)
        if: always()
        run: |
          if [ -n "${{ steps.provision.outputs.instance_id }}" ]; then
            aws ec2 terminate-instances --instance-ids "${{ steps.provision.outputs.instance_id }}"
            echo "Terminated ${{ steps.provision.outputs.instance_id }}"
          fi
