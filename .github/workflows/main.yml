name: lib-conxian-core CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v7.0.0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@11df97af8e8102fd60b60a77dfbf58d40cd8a3b2 # v1.17.0
        with:
          toolchain: stable

      - name: Lint and Format Check
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build Workspace
        run: |
          cargo build --workspace --release --locked

      - name: Test Workspace
        run: |
          cargo test --workspace --locked

      - name: Set up Python
        uses: actions/setup-python@d27e3f3d7c64b4bbf8e4abfb9b62b690f6017e85 # v6.3.0
        with:
          python-version: '3.10'

      - name: Run Validation Scripts
        run: |
          python scripts/verify_knowledge_retention.py
          python scripts/verify_tracked_artifacts.py
          python scripts/verify_compose_env_templates.py
          python scripts/verify_submodule_secret_filenames.py
          python scripts/verify_bos_production_boundary.py
          python scripts/verify_contamination_guard.py
          python scripts/verify_pr_bos_classification.py
          python scripts/verify_release_hygiene.py

  sbom-provenance:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v7.0.0

      - name: Generate SBOM
        uses: anchore/sbom-action@f325610c9d50ca3f8728f0262481bd06bae9a047 # v0.17.9
        with:
          format: spdx-json
          output-file: "lib-conxian-core.sbom.spdx.json"

      - name: Upload SBOM
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: sbom
          path: lib-conxian-core.sbom.spdx.json
