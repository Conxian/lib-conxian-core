name: lib-conxian-core CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable

      - name: Lint and Format Check
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build Workspace
        run: |
          cargo build --workspace --release --locked

      - name: Test Workspace
        run: |
          cargo test --workspace --locked

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Run Validation Scripts
        run: |
          python scripts/verify_signing_docs.py
          python scripts/verify_knowledge_retention.py
          python scripts/verify_tracked_artifacts.py
          python scripts/verify_compose_env_templates.py
          python scripts/verify_submodule_secret_filenames.py
          python scripts/verify_bos_production_boundary.py
          python scripts/verify_contamination_guard.py
          python scripts/verify_pr_bos_classification.py
          python scripts/verify_release_hygiene.py

  coverage:
    name: Report-first Rust coverage
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned coverage Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.89.0

      - name: Install pinned cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version 0.8.6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Test coverage tooling
        run: python scripts/test_coverage_report.py

      - name: Run report-first coverage
        run: |
          python scripts/coverage_report.py \
            --mode report-only \
            --baseline-label ci \
            --output-dir coverage/llvm-cov

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f coverage/llvm-cov/summary.md ]; then
            cat coverage/llvm-cov/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Coverage summary was not generated.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lib-conxian-core-coverage
          path: coverage/llvm-cov
          if-no-files-found: error
          retention-days: 14

  sbom-provenance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: spdx-json
          output-file: "lib-conxian-core.sbom.spdx.json"

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: lib-conxian-core.sbom.spdx.json
