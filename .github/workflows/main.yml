name: lib-conxian-core CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable

      - name: Lint and Format Check
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build Workspace
        run: |
          cargo build --workspace --release --locked

      - name: Test Workspace
        run: |
          cargo test --workspace --locked

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.10'

      - name: Run Validation Scripts
        run: |
          python scripts/verify_knowledge_retention.py
          python scripts/verify_tracked_artifacts.py
          python scripts/verify_compose_env_templates.py
          python scripts/verify_submodule_secret_filenames.py
          python scripts/verify_bos_production_boundary.py
          python scripts/verify_contamination_guard.py
          python scripts/verify_pr_bos_classification.py
          python scripts/verify_release_hygiene.py

  sbom-provenance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Generate SBOM
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          format: spdx-json
          output-file: "lib-conxian-core.sbom.spdx.json"

      - name: Upload SBOM
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: sbom
          path: lib-conxian-core.sbom.spdx.json
