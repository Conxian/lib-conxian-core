name: lib-conxian-core CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable

      - name: Lint and Format Check
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build Workspace
        run: |
          cargo build --workspace --release --locked

      - name: Test Workspace
        run: |
          cargo test --workspace --locked

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Run Validation Scripts
        run: |
          python scripts/verify_signing_docs.py
          python scripts/verify_knowledge_retention.py
          python scripts/verify_tracked_artifacts.py
          python scripts/verify_compose_env_templates.py
          python scripts/verify_submodule_secret_filenames.py
          python scripts/verify_bos_production_boundary.py
          python scripts/verify_contamination_guard.py
          python scripts/verify_pr_bos_classification.py
          python scripts/verify_release_hygiene.py

  coverage-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable

      - name: Install pinned LLVM coverage tooling
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.8.7 --locked
          cargo llvm-cov --version

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Test coverage evaluator
        run: python scripts/test_core_coverage.py

      - name: Capture coverage metadata
        run: |
          mkdir -p target/coverage
          {
            echo "commit: $(git rev-parse HEAD)"
            echo "rustc: $(rustc --version)"
            echo "cargo: $(cargo --version)"
            echo "cargo-llvm-cov: $(cargo llvm-cov --version)"
            echo "coverage-command: cargo llvm-cov --workspace --locked --json; cargo llvm-cov report --locked --lcov --html"
          } | tee target/coverage/metadata.txt

      - name: Generate coverage reports
        run: |
          mkdir -p target/coverage
          ignore='(^|/)(tests|fuzz|target|generated|vendor|examples)/'
          cargo llvm-cov --workspace --locked \
            --ignore-filename-regex "$ignore" \
            --json --output-path target/coverage/coverage.json
          cargo llvm-cov report --locked \
            --ignore-filename-regex "$ignore" \
            --lcov --output-path target/coverage/coverage.lcov
          cargo llvm-cov report --locked \
            --ignore-filename-regex "$ignore" \
            --html --output-dir target/coverage/html

      - name: Evaluate coverage policy (report-only)
        run: |
          python scripts/core_coverage.py \
            --input target/coverage/coverage.json \
            --policy config/core_coverage.json \
            --mode report-only \
            --commit-sha "$GITHUB_SHA" \
            --label "${GITHUB_REF_NAME:-unknown}" \
            --output-json target/coverage/core-coverage.json \
            --output-markdown target/coverage/core-coverage.md
          cat target/coverage/core-coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-coverage
          path: |
            target/coverage/coverage.json
            target/coverage/coverage.lcov
            target/coverage/html
            target/coverage/core-coverage.json
            target/coverage/core-coverage.md
            target/coverage/metadata.txt

  sbom-provenance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: spdx-json
          output-file: "lib-conxian-core.sbom.spdx.json"

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: lib-conxian-core.sbom.spdx.json
