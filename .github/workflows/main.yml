name: lib-conxian-core CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature_set:
          - name: default
            cargo_args: ''
          - name: all-features
            cargo_args: '--all-features'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy

      - name: Format Check
        if: matrix.feature_set.name == 'default'
        run: cargo fmt --all -- --check

      - name: Check (${{ matrix.feature_set.name }})
        run: cargo check --workspace --locked ${{ matrix.feature_set.cargo_args }}

      - name: Test (${{ matrix.feature_set.name }})
        run: cargo test --workspace --locked ${{ matrix.feature_set.cargo_args }}

      - name: Clippy (${{ matrix.feature_set.name }})
        run: cargo clippy --workspace --all-targets --locked ${{ matrix.feature_set.cargo_args }} -- -D warnings

      - name: Build Workspace (release)
        if: matrix.feature_set.name == 'default'
        run: cargo build --workspace --release --locked

      - name: Set up Python
        if: matrix.feature_set.name == 'default'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Run Validation Scripts
        if: matrix.feature_set.name == 'default'
        run: |
          python scripts/verify_signing_docs.py
          python scripts/verify_knowledge_retention.py
          python scripts/verify_tracked_artifacts.py
          python scripts/verify_compose_env_templates.py
          python scripts/verify_submodule_secret_filenames.py
          python scripts/verify_bos_production_boundary.py
          python scripts/verify_contamination_guard.py
          python scripts/verify_pr_bos_classification.py
          python scripts/verify_release_hygiene.py

  sbom-provenance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: spdx-json
          output-file: "lib-conxian-core.sbom.spdx.json"

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: lib-conxian-core.sbom.spdx.json
