name: lib-conxian-core CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.10.1
        with:
          toolchain: stable

      - name: Lint and Format Check
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build Workspace
        run: |
          cargo build --workspace --release --locked

      - name: Test Workspace
        run: |
          cargo test --workspace --locked

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.10'

      - name: Run Validation Scripts
        run: |
          python scripts/verify_knowledge_retention.py
          python scripts/verify_tracked_artifacts.py
          python scripts/verify_compose_env_templates.py
          python scripts/verify_submodule_secret_filenames.py
          python scripts/verify_bos_production_boundary.py
          python scripts/verify_contamination_guard.py
          python scripts/verify_pr_bos_classification.py
          python scripts/verify_release_hygiene.py

  msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Set up Rust MSRV
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: "1.85"

      - name: Build (MSRV)
        run: cargo build --workspace --locked

      - name: Test (MSRV)
        run: cargo test --workspace --locked

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Checkout Repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: stable

      - name: Build docs
        run: cargo doc --workspace --no-deps --locked

      - name: Run doc-tests
        run: cargo test --doc --workspace --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Install cargo-deny
        uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2
        with:
          tool: cargo-deny

      - name: Run cargo deny
        run: cargo deny check
