name: Conxian Gateway CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # Added submodule initialization

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build Gateway
        run: |
          # Now targeting the gateway directory
          # Gateway is a Rust binary as per PRD
          cd gateway
          if [ -f Cargo.toml ]; then
            cargo build --release
          else
            echo "Cargo.toml not found in gateway directory. Skipping build."
          fi

      - name: Deploy to GCP
        if: github.ref == 'refs/heads/main'
        run: |
          # Updated deployment paths to reference the new gateway infrastructure
          # Using gcloud CLI which is pre-installed on ubuntu-latest

          # In a real scenario, we would use:
          # gcloud auth activate-service-account --key-file=${{ secrets.GCP_SA_KEY }}
          # gcloud config set project ${{ secrets.GCP_PROJECT_ID }}

          echo "Deploying using migrated GCP configs in gateway/infrastructure/gcp/"
          ls -R gateway/infrastructure/gcp/

          # Example deployment command
