name: Conxian Gateway CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Lint and Format Check
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build Workspace
        run: |
          cargo build --workspace --release --locked

      - name: Compile All Targets (no-run)
        run: |
          cargo test --workspace --all-targets --locked --no-run

      - name: Test Workspace
        run: |
          cargo test --workspace --locked

      - name: Deploy to GCP
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Deploying Conxian Gateway to GCP..."
          # Target the new modularized infrastructure path
          cd gateway/infrastructure/gcp
          ls -la deployment.yaml
          # Deployment execution would go here
