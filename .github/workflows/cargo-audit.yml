name: Cargo Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Cargo audit
        run: |
          # Audit the exact committed lockfile. Remaining ignores are unmaintained warnings:
          # RUSTSEC-2024-0388 (derivative), RUSTSEC-2025-0057 (fxhash),
          # RUSTSEC-2024-0384 (instant), RUSTSEC-2024-0436 (paste)
          cargo audit --file Cargo.lock \
                       --ignore RUSTSEC-2024-0388 --ignore RUSTSEC-2025-0057 \
                       --ignore RUSTSEC-2024-0384 --ignore RUSTSEC-2024-0436
