name: Cargo Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Cargo audit
        run: |
          cargo generate-lockfile
          # Ignore rustls-webpki (transitive via bdk 0.30.2) and unmaintained warnings
          # RUSTSEC-2026-0104, RUSTSEC-2026-0099, RUSTSEC-2026-0098 (webpki)
          # RUSTSEC-2024-0388 (derivative), RUSTSEC-2025-0057 (fxhash),
          # RUSTSEC-2024-0384 (instant), RUSTSEC-2024-0436 (paste)
          cargo audit --ignore RUSTSEC-2026-0104 --ignore RUSTSEC-2026-0099 --ignore RUSTSEC-2026-0098 \
                       --ignore RUSTSEC-2024-0388 --ignore RUSTSEC-2025-0057 \
                       --ignore RUSTSEC-2024-0384 --ignore RUSTSEC-2024-0436
