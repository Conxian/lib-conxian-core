name: Fuzz Regression

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target:
          - parse_intent
          - anchoring_receipt
          - bip322_verify
          - bitcoin_psbt_deserialize
          - musig2_aggregate

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Rust nightly
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.12.0

      - name: Run bounded fuzz regression
        run: |
          set -euo pipefail
          mkdir -p "fuzz/artifacts/${{ matrix.target }}"
          cargo +nightly fuzz run "${{ matrix.target }}" "fuzz/corpus/${{ matrix.target }}" -- \
            -max_total_time=30 \
            -timeout=10 \
            -rss_limit_mb=2048 \
            -max_len=16384 \
            -artifact_prefix="fuzz/artifacts/${{ matrix.target }}/"

      - name: Upload fuzz failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failure-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fuzz/artifacts/${{ matrix.target }}/
            fuzz/corpus/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 14
