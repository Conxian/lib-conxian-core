name: SDK v2.0.17 Compatibility Evidence

'on':
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Core/SDK evidence matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.97.1

      - name: Fetch locked dependencies
        run: cargo +1.97.1 fetch --locked

      - name: Run offline locked compatibility matrix
        run: python3 scripts/run_sdk_compat.py --toolchain 1.97.1 --offline
