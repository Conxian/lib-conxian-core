name: Core Dependency Boundary

on:
  push:
    branches: [ candidate-base/v0.2.5 ]
  pull_request:
    branches: [ candidate-base/v0.2.5 ]

permissions:
  contents: read

jobs:
  verify-core-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test dependency boundary guard
        run: python3 -m unittest scripts/tests/test_verify_core_dependency_boundary.py

      - name: Verify locked Core dependency closure
        run: python3 scripts/verify_core_dependency_boundary.py
