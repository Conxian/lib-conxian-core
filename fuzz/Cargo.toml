[package]
name = "lib-conxian-core-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
bitcoin = { version = "0.32", features = ["serde", "rand", "std"] }
libfuzzer-sys = "0.4"
secp256k1 = { version = "0.31", features = ["rand", "global-context"] }
musig2 = { version = "0.4", features = ["secp256k1"] }
serde_json = "1.0"

[dependencies.lib-conxian-core]
path = ".."

[[bin]]
name = "parse_intent"
path = "fuzz_targets/parse_intent.rs"
test = false
doc = false

[[bin]]
name = "anchoring_receipt"
path = "fuzz_targets/anchoring_receipt.rs"
test = false
doc = false

[[bin]]
name = "bip322_verify"
path = "fuzz_targets/bip322_verify.rs"
test = false
doc = false

[[bin]]
name = "bitcoin_psbt_deserialize"
path = "fuzz_targets/bitcoin_psbt_deserialize.rs"
test = false
doc = false

[[bin]]
name = "musig2_aggregate"
path = "fuzz_targets/musig2_aggregate.rs"
test = false
doc = false
