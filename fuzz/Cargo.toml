[package]
name = "lib-conxian-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.85"
autobins = true
autolib = false

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1.0"
secp256k1 = { version = "0.31", features = ["rand", "global-context"] }
hex = "0.4"

[dependencies.lib-conxian-core]
path = ".."

[[bin]]
name = "psbt_parse"
path = "fuzz_targets/psbt_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "key_aggregate"
path = "fuzz_targets/key_aggregate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proof_verify"
path = "fuzz_targets/proof_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "anchoring_receipt"
path = "fuzz_targets/anchoring_receipt.rs"
test = false
doc = false
bench = false
