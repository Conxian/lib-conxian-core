[package]
name = "lib-conxian-core-sdk-compat"
version = "0.0.0"
description = "Opt-in, non-published Core/SDK release compatibility evidence harness."
edition = "2021"
rust-version = "1.91"
publish = false
autolib = false
autobins = false
autotests = false
autobenches = false
autoexamples = false

[dependencies]
lib-conxian-core = { package = "lib-conxian-core", path = "../..", default-features = false }
conxius-enclave-sdk = { version = "=2.0.11", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
# This package has no default test target. The explicit `run` feature keeps the
# SDK evidence graph out of ordinary workspace builds and tests.
run = []
core-enclave = ["lib-conxian-core/enclave"]
mock-cloud-enclave = ["conxius-enclave-sdk/mock-cloud-enclave"]
dev-attestation-bypass = ["conxius-enclave-sdk/dev-attestation-bypass"]
all-supported = ["mock-cloud-enclave", "dev-attestation-bypass"]

[[test]]
name = "compatibility"
path = "tests/compatibility.rs"
required-features = ["run"]
